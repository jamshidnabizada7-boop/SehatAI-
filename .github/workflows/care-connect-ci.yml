name: Care Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  care-connect-gate:
    name: Care Connect Validation & Regression Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-not-for-production-use-32chars"
      CARE_ENABLED: "true"
      CARE_PAYMENTS_ENABLED: "true"
      CARE_PAYMENT_PROVIDER: "mock"
      NODE_ENV: "development"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Setup local database
        run: |
          bunx prisma db push --accept-data-loss
          bunx tsx prisma/seed.ts
          bunx tsx prisma/seed-care.ts

      - name: Typecheck Care Connect surface
        run: |
          echo "Verifying Care Connect surface type safety..."
          CARE_ERRORS=$(node node_modules/typescript/bin/tsc --noEmit 2>&1 | grep -E "src/(app/api/care|app/api/doctor/care|lib/care|server/care|components/care)" || true)
          if [ -n "$CARE_ERRORS" ]; then
            echo "::error::TypeScript errors detected in Care Connect codebase:"
            echo "$CARE_ERRORS"
            exit 1
          fi
          echo "Care Connect surface is clean (0 errors)."

      - name: Run Care Connect unit & integration test suite
        run: bun test tests/care/

      - name: Run Care Connect commercial loop smoke test
        run: bunx tsx tests/care/care-smoke.ts
        env:
          CARE_PAYMENTS_ENABLED: "true"
          NODE_ENV: "development"

      - name: Regression gate — safety test suite
        run: |
          echo "Running safety regression suite (baseline: <= 19 pre-existing failures)..."
          SAFETY_OUTPUT=$(bun test tests/tests/safety/ 2>&1 || true)
          echo "$SAFETY_OUTPUT"
          # Count failures in safety output
          FAIL_COUNT=$(echo "$SAFETY_OUTPUT" | grep -o "[0-9]\+ tests failed" | awk '{print $1}' || echo "0")
          echo "Observed failure count: $FAIL_COUNT"
          if [ "$FAIL_COUNT" -gt 19 ]; then
            echo "::error::Safety regression detected! Failures ($FAIL_COUNT) exceed baseline of 19."
            exit 1
          fi
          echo "Regression gate passed: no new safety failures."

      - name: Build Next.js application
        run: bun run build
        env:
          NODE_ENV: "production"
