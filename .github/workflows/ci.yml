name: SehatAI Unified CI / Safety & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-safety-gate:
    name: Full Quality, Safety & Care Connect Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-not-for-production-use-32chars"
      CARE_ENABLED: "true"
      CARE_PAYMENTS_ENABLED: "true"
      CARE_PAYMENT_PROVIDER: "mock"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Setup local database
        run: |
          bunx prisma db push
          bunx tsx prisma/seed.ts
          bunx tsx prisma/seed-care.ts

      - name: Full Repository Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run Core Safety Test Suite
        run: bun test tests/tests/safety/

      - name: Run Care Connect Test Suite
        run: bun test tests/care/

      - name: Run Authorization & Security Red-Team Test Suite
        run: bun test tests/security/

      - name: Run Care Connect Smoke Test
        run: bunx tsx tests/care/care-smoke.ts

      - name: Next.js Production Build
        run: bun run build
        env:
          NODE_ENV: "production"
