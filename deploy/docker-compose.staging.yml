# ============================================================
# SehatAI Care Connect — Staging Docker Compose Stack
# Runs: Next.js Standalone, Dedicated Outbox Worker, Video Signal Relay, Caddy
# ============================================================
version: '3.8'

services:
  # 1. Main Next.js Web Application
  sehatai-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD: "1"
    container_name: sehatai-staging-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/care/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - storage_data:/app/storage/care
    networks:
      - sehatai_net

  # 2. Dedicated Outbox Worker Service Daemon (§17)
  sehatai-outbox-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sehatai-staging-outbox-worker
    restart: unless-stopped
    command: ["bun", "scripts/run-outbox-worker.ts", "--interval", "3000", "--batch", "20"]
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    depends_on:
      - sehatai-web
    networks:
      - sehatai_net

  # 3. Companion WebRTC Video Signaling Relay (:3004)
  sehatai-video-signal:
    image: node:22-alpine
    container_name: sehatai-staging-video-signal
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../mini-services/video-signal:/app
    command: ["node", "index.js"]
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
    networks:
      - sehatai_net

  # 4. Ingress Reverse Proxy with TLS (Caddy)
  sehatai-caddy:
    image: caddy:2-alpine
    container_name: sehatai-staging-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sehatai-web
      - sehatai-video-signal
    networks:
      - sehatai_net

volumes:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  sehatai_net:
    driver: bridge
